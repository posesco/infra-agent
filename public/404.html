<!DOCTYPE html>
<html lang="en">
<head>

    <title>404 | SRE-Gen Architect</title>

    <header>
        <div class="logo">SRE_GEN.v2</div>

    <main>
        <section class="hero">
            <h1 style="color: var(--neon-purple); filter: drop-shadow(0 0 20px rgba(112, 0, 255, 0.3));">404</h1>
            <p style="margin-top: -20px; text-transform: uppercase; letter-spacing: 5px; font-weight: 600;">Resource Drift Detected</p>
            <p style="font-size: 1.1rem; margin-bottom: 40px;">The endpoint you are looking for does not exist in the current state or has been decommissioned.</p>
            
            <div class="cta-container">
                <a href="index.html" class="btn-neon">Re-route to Base</a>

    <footer style="text-align: center; padding: 100px 20px; color: var(--text-dim); font-size: 0.9rem; font-weight: 300; letter-spacing: 1px;">
        STATUS: ERR_RESOURCE_NOT_FOUND // TRACE_ID: 404_DRIFT_01
