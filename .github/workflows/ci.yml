name: SRE-Gen CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        pip install checkov
    - name: Run SRE-Gen Architecture Check
      run: |
        python infra-agent.py
        checkov -f main.tf.json
